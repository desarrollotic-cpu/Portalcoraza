# PortalCoraza — Render Blueprint
# API: ya desplegada en portalcoraza.onrender.com (Web Service Node)
# Static sites: portal interno + minuta para vigilantes en puesto.

services:
  - type: web
    name: portalcoraza-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run web:build
    staticPublishPath: apps/web/dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: portalcoraza-minuta
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run minuta:build
    staticPublishPath: apps/minuta-web/dist/minuta-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
