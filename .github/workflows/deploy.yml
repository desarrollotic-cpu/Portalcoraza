name: Keep Alive & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Cada 10 minutos — evita que Render duerma la API
    - cron: '*/10 * * * *'

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to keep it alive
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://portalcoraza.onrender.com/health || echo "000")
          echo "API status: $STATUS"

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy — API
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_API }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
            echo "✔ API deploy triggered"
          else
            echo "⚠ RENDER_DEPLOY_HOOK_API no configurado — skip"
          fi
      - name: Trigger Render Deploy — Web
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
            echo "✔ Web deploy triggered"
          else
            echo "⚠ RENDER_DEPLOY_HOOK_WEB no configurado — skip"
          fi
      - name: Trigger Render Deploy — Minuta
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_MINUTA }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_MINUTA }}"
            echo "✔ Minuta deploy triggered"
          else
            echo "⚠ RENDER_DEPLOY_HOOK_MINUTA no configurado — skip"
          fi
      # Fallback: si Freider tenía configurado el hook único antiguo, se usa.
      - name: Trigger Render Deploy (legacy hook)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "✔ Legacy deploy triggered"
          fi
