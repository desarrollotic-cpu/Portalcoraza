    <script>
      (function () {
        try {
          var path = (location.pathname || '').replace(/\/$/, '');
          if (path === '/rondas/puntos' && location.hash.indexOf('#/rondas/puntos') !== 0) {
            location.replace('/#/rondas/puntos' + (location.search || ''));
            return;
          }
          if (path === '/rondas' && location.hash.indexOf('#/rondas') !== 0) {
            location.replace('/#/rondas' + (location.search || ''));
            return;
          }
          var mode = localStorage.getItem('coraza-color-scheme');
          if (mode !== 'dark' && mode !== 'light') mode = 'light';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
